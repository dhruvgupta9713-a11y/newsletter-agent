services:
  - type: web
    name: ai-newsletter-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: TAVILY_API_KEY
        sync: false
      - key: DEMO_MODE
        value: false
      - key: DEFAULT_SUBSCRIBER_COUNT
        value: 1420
